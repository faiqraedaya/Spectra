[project]
name = "2506p-spectra"
version = "0.1.0"
description = "PDF plan analyser: detects equipment, assigns it to sections and reports frequencies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2",
    "pymupdf>=1.27.2.3",
    "pyside6>=6.11.1",
    "roboflow>=1.3.8",
    "rtree>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra"]

[tool.pytest.ini_options]
testpaths = ["tests"]

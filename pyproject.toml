[project]
name = "2506p-spectra"
version = "0.1.0"
description = "PDF plan analyser: detects equipment, assigns it to sections and reports frequencies."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.4",
    "pypdfium2>=5.14.0",
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
